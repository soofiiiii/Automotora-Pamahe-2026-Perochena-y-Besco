server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  # El filtro HTTPS verifica el peer real antes de confiar en X-Forwarded-Proto.
  forward-headers-strategy: none

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/pamahe_db?useSSL=false&serverTimezone=America/Montevideo&allowPublicKeyRetrieval=true}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:50}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000

security:
  jwt:
    issuer: ${JWT_ISSUER:pamahe-api}
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    renewal-mode: REAUTHENTICATE
    refresh-enabled: false

app:
  cors:
    allowed-origins: ${FRONTEND_URL}
  storage:
    root: ${STORAGE_ROOT:/var/lib/pamahe/uploads}
  bootstrap-admin:
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

logging:
  level:
    root: INFO
    uy.edu.ctc.pamahe: INFO
