global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/pamahe-monitoring/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: pamahe-api
    metrics_path: /api/actuator/prometheus
    scrape_timeout: 10s
    http_headers:
      X-Forwarded-Proto:
        values: ['https']
      X-Monitoring-Token:
        files: ['/etc/pamahe-monitoring/scrape-token']
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: pamahe-health
    metrics_path: /probe
    params:
      module: [pamahe_local]
    static_configs:
      - targets: ['http://127.0.0.1:8080/api/actuator/health']
        labels: {component: api}
      - targets: ['http://127.0.0.1:8080/api/actuator/health/database']
        labels: {component: database}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '127.0.0.1:9115'
  - job_name: pamahe-node
    static_configs:
      - targets: ['127.0.0.1:9100']
